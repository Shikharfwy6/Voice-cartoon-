<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Alight Animation Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            height: 50px;
            background: #181920;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #282a36;
            z-index: 20;
        }

        .app-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050507;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        .viewport {
            position: relative;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            overflow: hidden;
            touch-action: none;
            perspective: 600px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
        }

        .ratio-16-9 { width: 100%; max-width: 640px; aspect-ratio: 16/9; }
        .ratio-9-16 { height: 100%; max-height: 480px; aspect-ratio: 9/16; }
        .ratio-1-1  { width: 100%; max-width: 380px; aspect-ratio: 1/1; }

        .draggable-element {
            position: absolute;
            top: 0;
            left: 0;
            cursor: move;
            touch-action: none;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .draggable-element.selected {
            outline: 2px dashed #ff4757;
            outline-offset: 4px;
        }

        .character-wrapper {
            width: 180px;
            height: 240px;
        }

        .character-wrapper svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Meme Overlay Screen */
        .meme-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .meme-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bottom-panel {
            height: 350px;
            background: #181920;
            border-top: 1px solid #282a36;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .tab-bar {
            display: flex;
            background: #101115;
            border-bottom: 1px solid #282a36;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 18px;
            background: none;
            border: none;
            color: #a4b0be;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #ff4757;
            border-bottom-color: #ff4757;
            background: #181920;
        }

        .tab-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .control-group { margin-bottom: 8px; }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a4b0be;
            margin-bottom: 3px;
        }

        input[type=range] { width: 100%; accent-color: #ff4757; }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-opt {
            padding: 10px;
            border: 1px solid #282a36;
            background: #20222c;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-opt.active { background: #ff4757; border-color: #ff4757; }

        .file-btn {
            background: #20222c;
            border: 1px dashed #4b4b4b;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-btn input { display: none; }

        .btn-record {
            background: #ff4757;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        .btn-play {
            background: #2ed573;
            color: #000;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }

        .btn-play.paused { background: #ffa500; color: #fff; }

        .status-text {
            font-size: 0.75rem;
            color: #2ed573;
            margin-bottom: 5px;
            text-align: center;
        }

        /* Interactive Timeline UI */
        .timeline-container {
            background: #101115;
            border: 1px solid #282a36;
            border-radius: 6px;
            padding: 10px;
            margin-top: 5px;
        }

        .timeline-tools {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-tool {
            background: #20222c;
            border: 1px solid #282a36;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-tool:hover { background: #ff4757; border-color: #ff4757; }
        .btn-tool.danger { background: #ff4757; }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #ff4757;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .timeline-track-wrapper {
            position: relative;
            background: #20222c;
            height: 55px;
            border-radius: 4px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0;
            touch-action: none;
            cursor: pointer;
        }

        .timeline-clips-container {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .timeline-clip {
            height: 42px;
            background: #2ed573;
            color: #000;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            position: relative;
            margin-right: 2px;
            border: 2px solid transparent;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .timeline-clip.selected {
            border-color: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .timeline-clip.meme-clip {
            background: #eccc68;
            color: #000;
        }

        .timeline-playhead {
            position: absolute;
            top: -5px;
            left: 0%;
            width: 4px;
            height: 65px;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            z-index: 30;
            pointer-events: none;
        }

        .timeline-playhead::before {
            content: '▼';
            position: absolute;
            top: -12px;
            left: -5px;
            color: #00ffff;
            font-size: 10px;
        }

        .timeline-ruler {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #747d8c;
            margin-top: 4px;
            padding: 0 2px;
        }

        #mouth { transform-origin: center center; transform-box: fill-box; }
        #left-arm { transform-origin: top right; transform-box: fill-box; }
        #right-arm { transform-origin: top left; transform-box: fill-box; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">🎬 2D Alight Animation Studio</div>
    </header>

    <main class="workspace">
        <div id="viewport" class="viewport ratio-16-9">
            <!-- Meme Video Stage Overlay -->
            <div id="memeOverlay" class="meme-overlay">
                <video id="memePlayer" playsinline muted></video>
            </div>

            <!-- Main Character -->
            <div id="characterWrapper" class="draggable-element character-wrapper selected" style="transform: translate3d(100px, 40px, 0px) scale(1);">
                <svg viewBox="-50 -20 450 500" xmlns="http://www.w3.org/2000/svg">
                    <g id="body" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <g id="left-leg">
                            <path d="M 140 330 L 135 410" fill="none"/>
                            <ellipse cx="125" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <g id="right-leg">
                            <path d="M 210 330 L 215 410" fill="none"/>
                            <ellipse cx="225" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <path d="M 110 210 L 240 210 L 230 330 L 120 330 Z" fill="#ffffff" />
                        <rect x="117" y="270" width="115" height="35" fill="#a03c51" stroke="#000" stroke-width="3" />
                        <g id="left-arm">
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="4" stroke="#000000" />
                            <path d="M 25 250 C 10 240, 5 260, 15 270 C 5 275, 10 285, 25 275" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <g id="right-arm">
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="4" stroke="#000000" />
                            <circle cx="290" cy="275" r="12" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <rect x="155" y="185" width="40" height="30" fill="#fcd7b6" stroke="#000" stroke-width="4" />
                        <g id="head">
                            <path d="M 100 130 C 95 200, 255 200, 250 130 C 255 70, 95 70, 100 130 Z" fill="#fcd7b6" />
                            <g id="eyes">
                                <ellipse cx="135" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="140" cy="120" r="7" fill="#000" />
                                <path d="M 110 100 Q 135 90 160 105" fill="none" stroke="#000" stroke-width="4" />
                                <ellipse cx="215" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="210" cy="120" r="7" fill="#000" />
                                <path d="M 190 105 Q 215 90 240 100" fill="none" stroke="#000" stroke-width="4" />
                            </g>
                            <path d="M 90 120 C 70 80, 90 30, 140 30 C 160 10, 200 10, 220 30 C 260 20, 280 70, 260 120 C 240 100, 240 70, 210 60 C 180 50, 130 60, 90 120 Z" fill="#801818" />
                            <ellipse id="mouth" cx="175" cy="165" rx="16" ry="4" fill="#801818" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <footer class="bottom-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('transform', event)">📐 3D Space (X,Y,Z)</button>
            <button class="tab-btn" onclick="switchTab('voice', event)">🎙️ Voice & Sync</button>
            <button class="tab-btn" onclick="switchTab('timeline', event)">⏱️ Timeline & Meme</button>
            <button class="tab-btn" onclick="switchTab('assets', event)">🖼️ Assets & BG</button>
            <button class="tab-btn" onclick="switchTab('ratio', event)">📱 Aspect Ratio</button>
        </div>

        <div id="tab-transform" class="tab-content active">
            <div class="control-group">
                <div class="slider-label"><span>X Axis</span><span id="xVal">100px</span></div>
                <input type="range" id="posXSlider" min="-300" max="600" value="100">
            </div>
            <div class="control-group">
                <div class="slider-label"><span>Y Axis</span><span id="yVal">40px</span></div>
                <input type="range" id="posYSlider" min="-300" max="400" value="40">
            </div>
            <div class="control-group">
                <div class="slider-label"><span>Z Axis (Depth)</span><span id="zVal">0px</span></div>
                <input type="range" id="posZSlider" min="-300" max="350" value="0">
            </div>
            <div class="control-group">
                <div class="slider-label"><span>Scale</span><span id="sVal">1.0x</span></div>
                <input type="range" id="scaleSlider" min="0.2" max="2.5" step="0.1" value="1.0">
            </div>
        </div>

        <div id="tab-voice" class="tab-content">
            <div id="audioStatus" class="status-text"></div>
            <div class="control-row">
                <label class="file-btn">
                    🎬 Select Video from Gallery
                    <input type="file" id="videoUpload" accept="video/*">
                </label>
            </div>
            <div class="control-group">
                <div class="slider-label"><span>Volume Level</span><span id="volVal">100%</span></div>
                <input type="range" id="volSlider" min="0" max="2" step="0.1" value="1.0">
            </div>
            <div class="control-row">
                <button id="recordBtn" class="btn-record">🎤 Record Mic</button>
                <button id="playBtn" class="btn-play" disabled>▶️ Play Timeline</button>
            </div>
        </div>

        <!-- Manual Interactive Timeline Tab -->
        <div id="tab-timeline" class="tab-content">
            <div class="timeline-container">
                <div class="timeline-tools">
                    <label class="btn-tool">
                        🤡 Add Meme Video
                        <input type="file" id="memeUpload" accept="video/*" style="display:none;">
                    </label>
                    <button class="btn-tool" onclick="splitClipAtPlayhead()">✂️ Cut at Playhead</button>
                    <button class="btn-tool danger" onclick="deleteSelectedClip()">🗑️ Delete Selected</button>
                </div>

                <div class="timeline-header">
                    <span>⏱️ Interactive Timeline</span>
                    <span id="timeCounter">0:00 / 0:00</span>
                </div>

                <div class="timeline-track-wrapper" id="trackWrapper">
                    <div class="timeline-clips-container" id="timelineClips"></div>
                    <div class="timeline-playhead" id="playhead"></div>
                </div>

                <div class="timeline-ruler" id="timelineRuler">
                    <span>0s</span>
                    <span>End</span>
                </div>
            </div>
        </div>

        <div id="tab-assets" class="tab-content">
            <div class="control-row">
                <label class="file-btn">
                    🖼️ Change Stage Background
                    <input type="file" id="bgUpload" accept="image/*">
                </label>
            </div>
        </div>

        <div id="tab-ratio" class="tab-content">
            <div class="btn-grid">
                <div class="btn-opt active" onclick="setRatio('16-9', event)">16:9 YouTube</div>
                <div class="btn-opt" onclick="setRatio('9-16', event)">9:16 Shorts</div>
                <div class="btn-opt" onclick="setRatio('1-1', event)">1:1 Square</div>
            </div>
        </div>
    </footer>

    <script>
        let audioContext, audioBuffer, activeSource, animationFrameId;
        let isPlaying = false, isPaused = false;
        let pauseOffset = 0, startTime = 0;
        let analyser, dataArray;

        // Sequence State Management
        let timelineClipsData = []; 
        let selectedClipId = null;
        let currentPlayheadTime = 0; // Current time position in timeline (in seconds)

        let selectedElement = document.getElementById('characterWrapper');
        const viewport = document.getElementById('viewport');
        const playhead = document.getElementById('playhead');
        const timeCounter = document.getElementById('timeCounter');
        const trackWrapper = document.getElementById('trackWrapper');
        const memeOverlay = document.getElementById('memeOverlay');
        const memePlayer = document.getElementById('memePlayer');
        const playBtn = document.getElementById('playBtn');

        function switchTab(tabId, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function getTotalTimelineDuration() {
            return timelineClipsData.reduce((acc, clip) => acc + clip.duration, 0);
        }

        // Render Dynamic Track Clips
        function renderTimelineUI() {
            const container = document.getElementById('timelineClips');
            container.innerHTML = '';
            
            const totalDur = getTotalTimelineDuration();

            timelineClipsData.forEach((clip) => {
                const clipDiv = document.createElement('div');
                clipDiv.className = `timeline-clip ${clip.type === 'meme' ? 'meme-clip' : ''} ${selectedClipId === clip.id ? 'selected' : ''}`;
                
                const widthPercent = totalDur > 0 ? (clip.duration / totalDur) * 100 : 100;
                clipDiv.style.width = `${widthPercent}%`;
                clipDiv.innerText = clip.type === 'voice' ? `🗣️ Voice (${clip.duration.toFixed(1)}s)` : `🤡 Meme (${clip.duration.toFixed(1)}s)`;
                
                clipDiv.onclick = (e) => {
                    e.stopPropagation();
                    selectedClipId = clip.id;
                    renderTimelineUI();
                };

                container.appendChild(clipDiv);
            });

            updateTimeDisplay();
        }

        function updateTimeDisplay() {
            const totalDur = getTotalTimelineDuration();
            timeCounter.innerText = `${currentPlayheadTime.toFixed(1)}s / ${totalDur.toFixed(1)}s`;
            const percent = totalDur > 0 ? (currentPlayheadTime / totalDur) * 100 : 0;
            playhead.style.left = `${Math.min(percent, 100)}%`;
        }

        // Manual Drag/Click Control for Finger Seeking
        function handleTimelineSeek(e) {
            const rect = trackWrapper.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clickX = clientX - rect.left;
            clickX = Math.max(0, Math.min(clickX, rect.width));

            const totalDur = getTotalTimelineDuration();
            if (totalDur <= 0) return;

            currentPlayheadTime = (clickX / rect.width) * totalDur;
            pauseOffset = currentPlayheadTime;
            
            if (isPlaying) {
                startPlaybackAt(currentPlayheadTime);
            } else {
                updateTimeDisplay();
            }
        }

        let isDraggingPlayhead = false;
        trackWrapper.addEventListener('pointerdown', (e) => {
            isDraggingPlayhead = true;
            handleTimelineSeek(e);
            window.addEventListener('pointermove', onPlayheadMove);
            window.addEventListener('pointerup', onPlayheadUp);
        });

        function onPlayheadMove(e) {
            if (isDraggingPlayhead) handleTimelineSeek(e);
        }

        function onPlayheadUp() {
            isDraggingPlayhead = false;
            window.removeEventListener('pointermove', onPlayheadMove);
            window.removeEventListener('pointerup', onPlayheadUp);
        }

        // Cut Clip exactly at Playhead Position
        function splitClipAtPlayhead() {
            if (timelineClipsData.length === 0) return;

            let accumulatedTime = 0;
            let targetIndex = -1;
            let localCutTime = 0;

            for (let i = 0; i < timelineClipsData.length; i++) {
                const clip = timelineClipsData[i];
                if (currentPlayheadTime >= accumulatedTime && currentPlayheadTime <= accumulatedTime + clip.duration) {
                    targetIndex = i;
                    localCutTime = currentPlayheadTime - accumulatedTime;
                    break;
                }
                accumulatedTime += clip.duration;
            }

            if (targetIndex !== -1) {
                const clip = timelineClipsData[targetIndex];
                if (localCutTime <= 0.2 || (clip.duration - localCutTime) <= 0.2) {
                    alert("Playhead ko clip ke andar position karein split karne ke liye!");
                    return;
                }

                const firstHalf = { ...clip, id: clip.type + '_' + Date.now() + '_1', duration: localCutTime };
                const secondHalf = { ...clip, id: clip.type + '_' + Date.now() + '_2', duration: clip.duration - localCutTime };

                timelineClipsData.splice(targetIndex, 1, firstHalf, secondHalf);
                renderTimelineUI();
            }
        }

        // Add Meme Video File
        document.getElementById('memeUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const videoUrl = URL.createObjectURL(file);
            const tempVid = document.createElement('video');
            tempVid.src = videoUrl;

            tempVid.onloadedmetadata = () => {
                timelineClipsData.push({
                    id: 'meme_' + Date.now(),
                    type: 'meme',
                    duration: tempVid.duration,
                    src: videoUrl
                });
                renderTimelineUI();
                playBtn.disabled = false;
                alert("🤡 Meme Added! Playhead slider se ise adjust kar sakte hain.");
            };
        });

        function deleteSelectedClip() {
            if (!selectedClipId) return;
            timelineClipsData = timelineClipsData.filter(c => c.id !== selectedClipId);
            selectedClipId = null;
            renderTimelineUI();
        }

        // Voice Upload Handler
        document.getElementById('videoUpload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('audioStatus').innerText = "⌛ Extracting voice...";
            try {
                const fileArrayBuffer = await file.arrayBuffer();
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioBuffer = await audioContext.decodeAudioData(fileArrayBuffer);
                
                playBtn.disabled = false;
                timelineClipsData = [{
                    id: 'voice_' + Date.now(),
                    type: 'voice',
                    duration: audioBuffer.duration
                }];
                renderTimelineUI();
                document.getElementById('audioStatus').innerText = "✅ Voice Track Ready!";
            } catch (err) {
                alert("Voice extract failed!");
            }
        });

        // Dynamic Playback Engine (Meme & Voice Sync)
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlaybackAt(currentPlayheadTime);
            }
        });

        function startPlaybackAt(timeSec) {
            if (activeSource) try { activeSource.stop(); } catch(e){}
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();

            startTime = audioContext.currentTime - timeSec;
            isPlaying = true;
            playBtn.innerText = '⏸️ Pause';

            animateTimeline();
        }

        function pausePlayback() {
            isPlaying = false;
            if (activeSource) try { activeSource.stop(); } catch(e){}
            memePlayer.pause();
            playBtn.innerText = '▶️ Play Timeline';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            resetPose();
        }

        function animateTimeline() {
            if (!isPlaying) return;

            currentPlayheadTime = audioContext.currentTime - startTime;
            const totalDur = getTotalTimelineDuration();

            if (currentPlayheadTime >= totalDur) {
                currentPlayheadTime = 0;
                pausePlayback();
                updateTimeDisplay();
                memeOverlay.style.display = 'none';
                return;
            }

            updateTimeDisplay();

            // Find current active clip in timeline
            let accumulated = 0;
            let activeClip = null;
            let localTime = 0;

            for (let clip of timelineClipsData) {
                if (currentPlayheadTime >= accumulated && currentPlayheadTime < accumulated + clip.duration) {
                    activeClip = clip;
                    localTime = currentPlayheadTime - accumulated;
                    break;
                }
                accumulated += clip.duration;
            }

            // Stage Switch Controller
            if (activeClip && activeClip.type === 'meme') {
                // Show Meme Overlay Screen & Auto-Play Video
                if (memeOverlay.style.display !== 'flex') {
                    memeOverlay.style.display = 'flex';
                    memePlayer.src = activeClip.src;
                    memePlayer.currentTime = localTime;
                    memePlayer.play().catch(()=>{});
                }
                resetPose(); // Pause Character Voice Animation
            } else {
                // Show 2D Character & Hide Meme Overlay
                if (memeOverlay.style.display === 'flex') {
                    memeOverlay.style.display = 'none';
                    memePlayer.pause();
                }

                // Simulate Voice Lip Sync during Voice Clips
                if (audioBuffer) {
                    const mouth = document.getElementById('mouth');
                    const leftArm = document.getElementById('left-arm');
                    const mouthScale = 1 + Math.abs(Math.sin(currentPlayheadTime * 15)) * 2.5;
                    if (mouth) mouth.style.transform = `scaleY(${mouthScale})`;
                    if (leftArm) leftArm.style.transform = `rotate(${Math.sin(currentPlayheadTime * 10) * 15}deg)`;
                }
            }

            animationFrameId = requestAnimationFrame(animateTimeline);
        }

        function resetPose() {
            document.getElementById('mouth').style.transform = 'scaleY(1)';
            document.getElementById('left-arm').style.transform = 'rotate(0deg)';
        }

        // Dragging 3D Position Logic
        function getTransformValues(el) {
            const transform = el.style.transform;
            const match3D = transform.match(/translate3d\(([^px]+)px,\s*([^px]+)px,\s*([^px]+)px\)/);
            const matchScale = transform.match(/scale\(([^)]+)\)/);
            return {
                x: match3D ? parseFloat(match3D[1]) : 0,
                y: match3D ? parseFloat(match3D[2]) : 0,
                z: match3D ? parseFloat(match3D[3]) : 0,
                s: matchScale ? parseFloat(matchScale[1]) : 1
            };
        }

        function applyTransformFromSliders() {
            if(!selectedElement) return;
            const x = posXSlider.value, y = posYSlider.value, z = posZSlider.value, s = scaleSlider.value;
            selectedElement.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(${s})`;
        }

        document.getElementById('posXSlider').oninput = applyTransformFromSliders;
        document.getElementById('posYSlider').oninput = applyTransformFromSliders;
        document.getElementById('posZSlider').oninput = applyTransformFromSliders;
        document.getElementById('scaleSlider').oninput = applyTransformFromSliders;

        function setRatio(ratio, e) {
            document.querySelectorAll('#tab-ratio .btn-opt').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            viewport.className = `viewport ratio-${ratio}`;
        }
    </script>
</body>
</html>
