<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Body Cartoon Voice Studio</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background: #16213e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .sidebar h2 {
            color: #e94560;
            font-size: 1.5rem;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group h3 {
            font-size: 1rem;
            color: #4ecca3;
        }

        .character-selector {
            display: flex;
            gap: 10px;
        }

        .character-selector button {
            flex: 1;
            padding: 10px;
            border: none;
            background: #0f3460;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .character-selector button.active, .character-selector button:hover {
            background: #e94560;
        }

        input[type="file"] {
            background: #0f3460;
            padding: 8px;
            border-radius: 5px;
            color: white;
            font-size: 0.8rem;
        }

        small {
            color: #888;
            font-size: 0.75rem;
        }

        .voice-effects {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input[type="range"] {
            width: 100%;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-record { background: #e94560; color: white; }
        .btn-record.recording { background: #ff414d; animation: pulse 1s infinite; }
        .btn-play { background: #4ecca3; color: #1a1a2e; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Stage Styling */
        .stage-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f3460, #16213e);
            position: relative;
            overflow: hidden;
        }

        .stage {
            width: 450px;
            height: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage svg {
            width: 100%;
            height: 100%;
        }

        /* Fixed SVG Animation Origins */
        #mouth {
            transform-origin: center center;
            transform-box: fill-box;
            transition: transform 0.05s ease-out;
        }

        #left-arm {
            transform-origin: top right;
            transform-box: fill-box;
            transition: transform 0.1s ease-out;
        }

        #right-arm {
            transform-origin: top left;
            transform-box: fill-box;
            transition: transform 0.1s ease-out;
        }

        #body {
            transform-origin: bottom center;
            transform-box: fill-box;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h2>🎨 Controls</h2>

            <div class="control-group">
                <h3>1. Select Full-Body Character</h3>
                <div class="character-selector">
                    <button onclick="selectCharacter('boy', event)" class="active">Boy</button>
                    <button onclick="selectCharacter('robot', event)">Robot</button>
                    <button onclick="selectCharacter('monster', event)">Monster</button>
                </div>
            </div>

            <div class="control-group">
                <h3>2. Upload Custom SVG</h3>
                <input type="file" id="svgUpload" accept=".svg">
                <small>SVG must contain IDs: <code>mouth</code>, <code>left-arm</code>, <code>right-arm</code></small>
            </div>

            <div class="control-group">
                <h3>3. Voice & Recording</h3>
                <div class="voice-effects">
                    <label for="pitch">Voice Pitch (Cartoon Effect):</label>
                    <input type="range" id="pitch" min="0.5" max="2.0" step="0.1" value="1.4">
                </div>
                
                <div class="action-buttons">
                    <button id="recordBtn" class="btn btn-record">🎤 Start Recording</button>
                    <button id="playBtn" class="btn btn-play" disabled>▶️ Play & Sync</button>
                </div>
            </div>
        </aside>

        <main class="stage-container">
            <div id="stage" class="stage"></div>
        </main>
    </div>

    <script>
        // Full Body Vector SVGs
        const characters = {
            boy: `
                <svg viewBox="0 0 300 400">
                    <g id="body">
                        <!-- Legs -->
                        <rect x="115" y="270" width="25" height="90" rx="10" fill="#2c3e50" />
                        <rect x="160" y="270" width="25" height="90" rx="10" fill="#2c3e50" />
                        <!-- Shoes -->
                        <rect x="105" y="350" width="35" height="20" rx="8" fill="#e74c3c" />
                        <rect x="160" y="350" width="35" height="20" rx="8" fill="#e74c3c" />
                        
                        <!-- Torso/Shirt -->
                        <path d="M 100 170 L 200 170 L 195 280 L 105 280 Z" fill="#e94560" rx="10" />

                        <!-- Left Arm -->
                        <g id="left-arm">
                            <rect x="65" y="170" width="25" height="90" rx="12" fill="#e94560" />
                            <circle cx="77" cy="270" r="14" fill="#f1c27d" />
                        </g>

                        <!-- Right Arm -->
                        <g id="right-arm">
                            <rect x="210" y="170" width="25" height="90" rx="12" fill="#e94560" />
                            <circle cx="222" cy="270" r="14" fill="#f1c27d" />
                        </g>

                        <!-- Head Group -->
                        <g id="head">
                            <circle cx="150" cy="110" r="55" fill="#f1c27d" />
                            <!-- Eyes -->
                            <circle cx="130" cy="100" r="8" fill="#333" />
                            <circle cx="170" cy="100" r="8" fill="#333" />
                            <!-- Hair -->
                            <path d="M 95 100 Q 150 30 205 100" fill="#4a2e1d" />
                            <!-- Mouth -->
                            <ellipse id="mouth" cx="150" cy="135" rx="18" ry="3" fill="#900000" />
                        </g>
                    </g>
                </svg>`,
            robot: `
                <svg viewBox="0 0 300 400">
                    <g id="body">
                        <!-- Legs -->
                        <rect x="110" y="270" width="30" height="90" rx="5" fill="#7f8c8d" />
                        <rect x="160" y="270" width="30" height="90" rx="5" fill="#7f8c8d" />
                        
                        <!-- Torso -->
                        <rect x="90" y="150" width="120" height="120" rx="15" fill="#95a5a6" />
                        <circle cx="150" cy="210" r="25" fill="#00d2d3" />

                        <!-- Left Arm -->
                        <g id="left-arm">
                            <rect x="50" y="150" width="25" height="100" rx="10" fill="#7f8c8d" />
                            <circle cx="62" cy="260" r="12" fill="#e74c3c" />
                        </g>

                        <!-- Right Arm -->
                        <g id="right-arm">
                            <rect x="225" y="150" width="25" height="100" rx="10" fill="#7f8c8d" />
                            <circle cx="237" cy="260" r="12" fill="#e74c3c" />
                        </g>

                        <!-- Head -->
                        <g id="head">
                            <rect x="100" y="40" width="100" height="90" rx="15" fill="#bdc3c7" />
                            <!-- Eyes -->
                            <rect x="115" y="65" width="25" height="15" fill="#e74c3c" />
                            <rect x="160" y="65" width="25" height="15" fill="#e74c3c" />
                            <!-- Antenna -->
                            <line x1="150" y1="40" x2="150" y2="15" stroke="#7f8c8d" stroke-width="6"/>
                            <circle cx="150" cy="12" r="8" fill="#f1c40f" />
                            <!-- Mouth -->
                            <rect id="mouth" x="120" y="105" width="60" height="5" fill="#2c3e50" rx="2" />
                        </g>
                    </g>
                </svg>`,
            monster: `
                <svg viewBox="0 0 300 400">
                    <g id="body">
                        <!-- Monster Body -->
                        <path d="M 60 360 C 40 100, 260 100, 240 360 Z" fill="#a55eea" />
                        
                        <!-- Feet -->
                        <ellipse cx="100" cy="360" rx="30" ry="15" fill="#8e44ad" />
                        <ellipse cx="200" cy="360" rx="30" ry="15" fill="#8e44ad" />

                        <!-- Left Arm -->
                        <g id="left-arm">
                            <path d="M 75 210 Q 30 230 40 280" stroke="#a55eea" stroke-width="25" stroke-linecap="round" fill="none" />
                        </g>

                        <!-- Right Arm -->
                        <g id="right-arm">
                            <path d="M 225 210 Q 270 230 260 280" stroke="#a55eea" stroke-width="25" stroke-linecap="round" fill="none" />
                        </g>

                        <!-- Eyes -->
                        <circle cx="150" cy="140" r="30" fill="#fff" />
                        <circle cx="150" cy="140" r="12" fill="#000" />
                        
                        <!-- Horns -->
                        <polygon points="90,110 70,60 110,90" fill="#f7b731" />
                        <polygon points="210,110 230,60 190,90" fill="#f7b731" />

                        <!-- Mouth -->
                        <ellipse id="mouth" cx="150" cy="220" rx="35" ry="6" fill="#2d98da" />
                    </g>
                </svg>`
        };

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let audioContext;
        let audioBuffer;
        let activeSource = null;
        let animationFrameId = null;

        const stage = document.getElementById('stage');
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const pitchInput = document.getElementById('pitch');
        const svgUpload = document.getElementById('svgUpload');

        stage.innerHTML = characters.boy;

        function selectCharacter(type, event) {
            document.querySelectorAll('.character-selector button').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            if (characters[type]) {
                stage.innerHTML = characters[type];
            }
        }

        svgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    stage.innerHTML = event.target.result;
                };
                reader.readAsText(file);
            }
        });

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        
                        playBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Error accessing microphone: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.innerText = '🎤 Start Recording';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (activeSource) {
                try { activeSource.stop(); } catch(e){}
            }

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            const source = audioContext.createBufferSource();
            activeSource = source;
            source.buffer = audioBuffer;

            source.playbackRate.value = parseFloat(pitchInput.value);

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.6;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            source.start(0);

            function animateCharacter() {
                const mouth = document.getElementById('mouth');
                const leftArm = document.getElementById('left-arm');
                const rightArm = document.getElementById('right-arm');
                const body = document.getElementById('body');

                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                let average = sum / bufferLength;

                // 1. Lip Sync (Mouth vertical stretch)
                if (mouth) {
                    let scaleY = 1 + (average / 30);
                    if (scaleY > 3.5) scaleY = 3.5;
                    mouth.style.transform = `scaleY(${scaleY})`;
                }

                // 2. Arms Movement (Rotate depending on audio volume)
                if (leftArm && rightArm) {
                    let armRotation = (average / 5); // Arm angle
                    leftArm.style.transform = `rotate(${armRotation}deg)`;
                    rightArm.style.transform = `rotate(-${armRotation}deg)`;
                }

                // 3. Body Subtle Bounce (Breathing/Talking rhythm)
                if (body) {
                    let bodyScale = 1 + (average / 500);
                    body.style.transform = `scale(${bodyScale})`;
                }

                animationFrameId = requestAnimationFrame(animateCharacter);
            }

            animateCharacter();

            source.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                
                // Reset Pose
                const mouth = document.getElementById('mouth');
                const leftArm = document.getElementById('left-arm');
                const rightArm = document.getElementById('right-arm');
                const body = document.getElementById('body');

                if (mouth) mouth.style.transform = 'scaleY(1)';
                if (leftArm) leftArm.style.transform = 'rotate(0deg)';
                if (rightArm) rightArm.style.transform = 'rotate(0deg)';
                if (body) body.style.transform = 'scale(1)';
                
                activeSource = null;
            };
        });
    </script>
</body>
</html>
