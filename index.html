<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Alight Animation Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        .app-header {
            height: 50px;
            background: #181920;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #282a36;
            z-index: 20;
        }

        .app-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Workspace Canvas Area with 3D Perspective */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050507;
            position: relative;
            overflow: hidden;
            padding: 10px;
            perspective: 800px; /* Alight Motion 3D Camera Perspective */
        }

        .viewport {
            position: relative;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            overflow: hidden;
            touch-action: none;
            transform-style: preserve-3d;
        }

        /* Aspect Ratios */
        .ratio-16-9 { width: 100%; max-width: 640px; aspect-ratio: 16/9; }
        .ratio-9-16 { height: 100%; max-height: 480px; aspect-ratio: 9/16; }
        .ratio-1-1  { width: 100%; max-width: 380px; aspect-ratio: 1/1; }

        /* Draggable 3D Elements */
        .draggable-element {
            position: absolute;
            top: 0;
            left: 0;
            cursor: move;
            touch-action: none;
            display: inline-block;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .draggable-element.selected {
            outline: 2px dashed #ff4757;
            outline-offset: 4px;
        }

        .character-wrapper {
            width: 180px;
            height: 240px;
        }

        .character-wrapper svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .asset-wrapper img {
            width: 100px;
            height: auto;
            pointer-events: none;
        }

        /* Bottom Controls Drawer */
        .bottom-panel {
            height: 280px;
            background: #181920;
            border-top: 1px solid #282a36;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .tab-bar {
            display: flex;
            background: #101115;
            border-bottom: 1px solid #282a36;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 18px;
            background: none;
            border: none;
            color: #a4b0be;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #ff4757;
            border-bottom-color: #ff4757;
            background: #181920;
        }

        .tab-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* UI Slider Groups & Controls */
        .control-group {
            margin-bottom: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a4b0be;
            margin-bottom: 3px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #ff4757;
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-opt {
            padding: 10px;
            border: 1px solid #282a36;
            background: #20222c;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-opt.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .file-btn {
            background: #20222c;
            border: 1px dashed #4b4b4b;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        .file-btn input { display: none; }

        .btn-record {
            background: #ff4757;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
        }

        .btn-play {
            background: #2ed573;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
        }

        .btn-record.recording {
            animation: pulse 1s infinite;
            background: #ff6b81;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #20222c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        /* SVG Joints setup */
        #mouth { transform-origin: center center; transform-box: fill-box; }
        #left-arm { transform-origin: top right; transform-box: fill-box; }
        #right-arm { transform-origin: top left; transform-box: fill-box; }
        #left-leg { transform-origin: top center; transform-box: fill-box; }
        #right-leg { transform-origin: top center; transform-box: fill-box; }
        #body { transform-origin: bottom center; transform-box: fill-box; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">🎬 2D Alight Animation Studio</div>
    </header>

    <main class="workspace">
        <div id="viewport" class="viewport ratio-16-9">
            <div id="characterWrapper" class="draggable-element character-wrapper selected" style="transform: translate3d(100px, 40px, 0px) scale(1);">
                <svg viewBox="-50 -20 450 500" xmlns="http://www.w3.org/2000/svg">
                    <g id="body" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <g id="left-leg">
                            <path d="M 140 330 L 135 410" fill="none"/>
                            <ellipse cx="125" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <g id="right-leg">
                            <path d="M 210 330 L 215 410" fill="none"/>
                            <ellipse cx="225" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <path d="M 110 210 L 240 210 L 230 330 L 120 330 Z" fill="#ffffff" />
                        <rect x="117" y="270" width="115" height="35" fill="#a03c51" stroke="#000" stroke-width="3" />
                        <g id="left-arm">
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="4" stroke="#000000" />
                            <path d="M 25 250 C 10 240, 5 260, 15 270 C 5 275, 10 285, 25 275" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <g id="right-arm">
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="4" stroke="#000000" />
                            <circle cx="290" cy="275" r="12" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <rect x="155" y="185" width="40" height="30" fill="#fcd7b6" stroke="#000" stroke-width="4" />
                        <g id="head">
                            <path d="M 100 130 C 95 200, 255 200, 250 130 C 255 70, 95 70, 100 130 Z" fill="#fcd7b6" />
                            <g id="eyes">
                                <ellipse cx="135" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="140" cy="120" r="7" fill="#000" />
                                <path d="M 110 100 Q 135 90 160 105" fill="none" stroke="#000" stroke-width="4" />
                                <ellipse cx="215" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="210" cy="120" r="7" fill="#000" />
                                <path d="M 190 105 Q 215 90 240 100" fill="none" stroke="#000" stroke-width="4" />
                            </g>
                            <path d="M 90 120 C 70 80, 90 30, 140 30 C 160 10, 200 10, 220 30 C 260 20, 280 70, 260 120 C 240 100, 240 70, 210 60 C 180 50, 130 60, 90 120 Z" fill="#801818" />
                            <ellipse id="mouth" cx="175" cy="165" rx="16" ry="4" fill="#801818" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <footer class="bottom-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('transform', event)">📐 3D Space (X, Y, Z)</button>
            <button class="tab-btn" onclick="switchTab('voice', event)">🎙️ Voice & Effects</button>
            <button class="tab-btn" onclick="switchTab('assets', event)">🖼️ Assets & BG</button>
            <button class="tab-btn" onclick="switchTab('ratio', event)">📱 Aspect Ratio</button>
            <button class="tab-btn" onclick="switchTab('layers', event)">📚 Layers Stack</button>
        </div>

        <!-- Tab 1: Transform 3D (X, Y, Z Axis + Scale) -->
        <div id="tab-transform" class="tab-content active">
            <div class="control-group">
                <div class="slider-label"><span>X Axis (Horizontal)</span><span id="xVal">100px</span></div>
                <input type="range" id="posXSlider" min="-300" max="600" value="100">
            </div>

            <div class="control-group">
                <div class="slider-label"><span>Y Axis (Vertical)</span><span id="yVal">40px</span></div>
                <input type="range" id="posYSlider" min="-300" max="400" value="40">
            </div>

            <div class="control-group">
                <div class="slider-label"><span>Z Axis (3D Depth: Forward / Backward)</span><span id="zVal">0px</span></div>
                <input type="range" id="posZSlider" min="-400" max="400" value="0">
            </div>

            <div class="control-group">
                <div class="slider-label"><span>Scale (Overall Size)</span><span id="sVal">1.0x</span></div>
                <input type="range" id="scaleSlider" min="0.2" max="2.5" step="0.1" value="1.0">
            </div>
        </div>

        <!-- Tab 2: Voice FX -->
        <div id="tab-voice" class="tab-content">
            <div class="control-group">
                <div class="slider-label"><span>Pitch Control</span><span id="pitchVal">1.0x</span></div>
                <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <div class="slider-label"><span>Speed / Tempo</span><span id="speedVal">1.0x</span></div>
                <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <div class="slider-label"><span>Volume Level</span><span id="volVal">100%</span></div>
                <input type="range" id="volSlider" min="0" max="2" step="0.1" value="1.0">
            </div>

            <div class="control-row">
                <label style="font-size:0.8rem; color:#a4b0be; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="telephonicFx"> 📞 Walkie-Talkie / Robot Filter FX
                </label>
            </div>

            <div class="control-row">
                <button id="recordBtn" class="btn-record">🎤 Record Voice</button>
                <button id="playBtn" class="btn-play" disabled>▶️ Sync & Play Voice</button>
            </div>
        </div>

        <!-- Tab 3: Assets & BG -->
        <div id="tab-assets" class="tab-content">
            <div class="control-row">
                <label class="file-btn">
                    ➕ Upload Custom Asset (PNG/SVG)
                    <input type="file" id="assetUpload" accept="image/*">
                </label>
            </div>
            <div class="control-row">
                <label class="file-btn">
                    🖼️ Change Stage Background
                    <input type="file" id="bgUpload" accept="image/*">
                </label>
            </div>
        </div>

        <!-- Tab 4: Aspect Ratio -->
        <div id="tab-ratio" class="tab-content">
            <div class="btn-grid">
                <div class="btn-opt active" onclick="setRatio('16-9', event)">16:9 YouTube</div>
                <div class="btn-opt" onclick="setRatio('9-16', event)">9:16 Shorts</div>
                <div class="btn-opt" onclick="setRatio('1-1', event)">1:1 Square</div>
            </div>
        </div>

        <!-- Tab 5: Layers Stack -->
        <div id="tab-layers" class="tab-content">
            <div id="layerList">
                <div class="layer-item active">
                    <span>🎭 Main Character</span>
                    <span>Active</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        let audioContext, audioBuffer, activeSource, animationFrameId;
        let selectedElement = document.getElementById('characterWrapper');

        const viewport = document.getElementById('viewport');
        const posXSlider = document.getElementById('posXSlider');
        const posYSlider = document.getElementById('posYSlider');
        const posZSlider = document.getElementById('posZSlider');
        const scaleSlider = document.getElementById('scaleSlider');

        const pitchSlider = document.getElementById('pitchSlider');
        const speedSlider = document.getElementById('speedSlider');
        const volSlider = document.getElementById('volSlider');
        const telephonicFx = document.getElementById('telephonicFx');

        // Tab Switching Engine
        function switchTab(tabId, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Voice Controls Displays
        pitchSlider.oninput = (e) => document.getElementById('pitchVal').innerText = `${e.target.value}x`;
        speedSlider.oninput = (e) => document.getElementById('speedVal').innerText = `${e.target.value}x`;
        volSlider.oninput = (e) => document.getElementById('volVal').innerText = `${Math.round(e.target.value * 100)}%`;

        // Aspect Ratio Switcher
        function setRatio(ratio, e) {
            document.querySelectorAll('#tab-ratio .btn-opt').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            viewport.className = `viewport ratio-${ratio}`;
        }

        // Background Upload
        document.getElementById('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    viewport.style.backgroundImage = `url('${evt.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Add Custom PNG/SVG Asset
        document.getElementById('assetUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const assetDiv = document.createElement('div');
                    assetDiv.className = 'draggable-element asset-wrapper';
                    assetDiv.style.transform = `translate3d(50px, 50px, 0px) scale(1)`;
                    assetDiv.innerHTML = `<img src="${evt.target.result}">`;
                    
                    viewport.appendChild(assetDiv);
                    makeDraggable(assetDiv);
                    selectElement(assetDiv);

                    const layerList = document.getElementById('layerList');
                    const layerItem = document.createElement('div');
                    layerItem.className = 'layer-item';
                    layerItem.innerHTML = `<span>📦 Asset Layer</span><span onclick="this.parentElement.remove(); assetDiv.remove();">🗑️</span>`;
                    layerList.appendChild(layerItem);
                };
                reader.readAsDataURL(file);
            }
        });

        // Parse 3D Transform String
        function getTransformValues(el) {
            const transform = el.style.transform;
            const match3D = transform.match(/translate3d\(([^px]+)px,\s*([^px]+)px,\s*([^px]+)px\)/);
            const matchScale = transform.match(/scale\(([^)]+)\)/);
            
            let x = match3D ? parseFloat(match3D[1]) : 0;
            let y = match3D ? parseFloat(match3D[2]) : 0;
            let z = match3D ? parseFloat(match3D[3]) : 0;
            let s = matchScale ? parseFloat(matchScale[1]) : 1;
            return { x, y, z, s };
        }

        // Sync 3D Transform Sliders with Selected Element
        function updateTransformSliders(x, y, z, s) {
            posXSlider.value = Math.round(x);
            posYSlider.value = Math.round(y);
            posZSlider.value = Math.round(z);
            scaleSlider.value = s;

            document.getElementById('xVal').innerText = `${Math.round(x)}px`;
            document.getElementById('yVal').innerText = `${Math.round(y)}px`;
            document.getElementById('zVal').innerText = `${Math.round(z)}px`;
            document.getElementById('sVal').innerText = `${parseFloat(s).toFixed(1)}x`;
        }

        function applyTransformFromSliders() {
            if(!selectedElement) return;
            const x = posXSlider.value;
            const y = posYSlider.value;
            const z = posZSlider.value;
            const s = scaleSlider.value;

            selectedElement.style.transform = `translate3d(${x}px, ${y}px, ${z}px) scale(${s})`;
            updateTransformSliders(x, y, z, s);
        }

        posXSlider.oninput = applyTransformFromSliders;
        posYSlider.oninput = applyTransformFromSliders;
        posZSlider.oninput = applyTransformFromSliders;
        scaleSlider.oninput = applyTransformFromSliders;

        // Touch & Drag 3D System
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, currentX = 100, currentY = 40, currentZ = 0, currentScale = 1;

            function onPointerDown(e) {
                isDragging = true;
                selectElement(element);

                const coords = getTransformValues(element);
                currentX = coords.x;
                currentY = coords.y;
                currentZ = coords.z;
                currentScale = coords.s;

                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
                startY = (e.touches ? e.touches[0].clientY : e.clientY) - currentY;

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                currentX = clientX - startX;
                currentY = clientY - startY;

                element.style.transform = `translate3d(${currentX}px, ${currentY}px, ${currentZ}px) scale(${currentScale})`;
                updateTransformSliders(currentX, currentY, currentZ, currentScale);
            }

            function onPointerUp() {
                isDragging = false;
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            }

            element.addEventListener('pointerdown', onPointerDown);
        }

        function selectElement(el) {
            document.querySelectorAll('.draggable-element').forEach(e => e.classList.remove('selected'));
            selectedElement = el;
            selectedElement.classList.add('selected');

            const coords = getTransformValues(selectedElement);
            updateTransformSliders(coords.x, coords.y, coords.z, coords.s);
        }

        makeDraggable(document.getElementById('characterWrapper'));

        // Audio Recording & Advanced DSP Processing
        let mediaRecorder, audioChunks = [];
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        playBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Mic Access Denied: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.innerText = '🎤 Record Voice';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            if (activeSource) try { activeSource.stop(); } catch(e){}
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const source = audioContext.createBufferSource();
            activeSource = source;
            source.buffer = audioBuffer;

            source.playbackRate.value = parseFloat(pitchSlider.value) * parseFloat(speedSlider.value);

            const gainNode = audioContext.createGain();
            gainNode.gain.value = parseFloat(volSlider.value);

            let lastNode = source;

            if (telephonicFx.checked) {
                const filter = audioContext.createBiquadFilter();
                filter.type = "bandpass";
                filter.frequency.value = 1000;
                filter.Q.value = 3.0;
                lastNode.connect(filter);
                lastNode = filter;
            }

            lastNode.connect(gainNode);

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.5;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            gainNode.connect(analyser);
            analyser.connect(audioContext.destination);

            source.start(0);

            function animate() {
                const mouth = document.getElementById('mouth');
                const leftArm = document.getElementById('left-arm');
                const rightArm = document.getElementById('right-arm');
                const leftLeg = document.getElementById('left-leg');
                const rightLeg = document.getElementById('right-leg');

                analyser.getByteFrequencyData(dataArray);
                let sum = dataArray.reduce((a, b) => a + b, 0);
                let average = sum / dataArray.length;

                if (mouth) mouth.style.transform = `scaleY(${Math.min(1 + average / 20, 4.5)})`;
                if (leftArm && rightArm) {
                    leftArm.style.transform = `rotate(${average / 6}deg)`;
                    rightArm.style.transform = `rotate(-${average / 6}deg)`;
                }
                if (leftLeg && rightLeg) {
                    leftLeg.style.transform = `rotate(-${average / 15}deg)`;
                    rightLeg.style.transform = `rotate(${average / 15}deg)`;
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            animate();

            source.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.getElementById('mouth').style.transform = 'scaleY(1)';
                document.getElementById('left-arm').style.transform = 'rotate(0deg)';
                document.getElementById('right-arm').style.transform = 'rotate(0deg)';
                document.getElementById('left-leg').style.transform = 'rotate(0deg)';
                document.getElementById('right-leg').style.transform = 'rotate(0deg)';
            };
        });
    </script>
</body>
</html>
