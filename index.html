<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Pro Animation Studio</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 360px;
            background: #1e1e1e;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #ff4757;
            font-size: 1.3rem;
            border-bottom: 2px solid #2f3542;
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #252830;
            padding: 10px;
            border-radius: 6px;
        }

        .control-group h3 {
            font-size: 0.9rem;
            color: #2ed573;
            text-transform: uppercase;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .btn-option {
            padding: 8px;
            border: none;
            background: #2f3542;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .btn-option.active, .btn-option:hover {
            background: #ff4757;
        }

        .axis-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .axis-box {
            display: flex;
            flex-direction: column;
            font-size: 0.75rem;
            color: #a4b0be;
        }

        .axis-box input {
            background: #1e1e1e;
            border: 1px solid #2f3542;
            color: white;
            padding: 5px;
            border-radius: 4px;
            margin-top: 3px;
        }

        input[type="file"] {
            background: #1e1e1e;
            padding: 6px;
            border-radius: 4px;
            color: white;
            font-size: 0.75rem;
            border: 1px solid #2f3542;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-record { background: #ff4757; color: white; }
        .btn-record.recording { background: #ff6b81; animation: pulse 1s infinite; }
        .btn-play { background: #2ed573; color: #1e1e1e; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Stage Area */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .stage-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #181818;
        }

        .viewport {
            position: relative;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: width 0.3s, height 0.3s;
            overflow: hidden;
        }

        /* Aspect Ratios */
        .ratio-16-9 { width: 768px; height: 432px; }
        .ratio-9-16 { width: 324px; height: 576px; }
        .ratio-1-1  { width: 450px; height: 450px; }

        .character-wrapper {
            position: absolute;
            width: 300px;
            height: 400px;
            transform-origin: center center;
            top: 50px;
            left: 200px;
            cursor: move;
        }

        .character-wrapper svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Layers Panel Bottom Area */
        .timeline-panel {
            height: 180px;
            background: #181818;
            border-top: 2px solid #2f3542;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #2ed573;
        }

        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #252830;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .layer-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layer-btn {
            background: none;
            border: none;
            color: #a4b0be;
            cursor: pointer;
        }

        /* Dynamic SVG Transformations */
        #mouth { transform-origin: center center; transform-box: fill-box; }
        #left-arm { transform-origin: top right; transform-box: fill-box; }
        #right-arm { transform-origin: top left; transform-box: fill-box; }
        #left-leg { transform-origin: top center; transform-box: fill-box; }
        #right-leg { transform-origin: top center; transform-box: fill-box; }
        #body { transform-origin: bottom center; transform-box: fill-box; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <h2>🎬 2D Animation Studio</h2>

            <!-- 1. Voice Presets -->
            <div class="control-group">
                <h3>1. Voice Selector</h3>
                <div class="btn-grid">
                    <button class="btn-option active" onclick="setVoice('normal', event)">Normal</button>
                    <button class="btn-option" onclick="setVoice('kid', event)">Funny Kid</button>
                    <button class="btn-option" onclick="setVoice('monster', event)">Deep/Ghost</button>
                </div>
            </div>

            <!-- 2. Background Upload -->
            <div class="control-group">
                <h3>2. Stage Background</h3>
                <input type="file" id="bgUpload" accept="image/*">
            </div>

            <!-- 3. Ratio Selector -->
            <div class="control-group">
                <h3>3. Aspect Ratio</h3>
                <div class="btn-grid">
                    <button class="btn-option active" onclick="setRatio('16-9', event)">16:9</button>
                    <button class="btn-option" onclick="setRatio('9-16', event)">9:16 Shorts</button>
                    <button class="btn-option" onclick="setRatio('1-1', event)">1:1 Square</button>
                </div>
            </div>

            <!-- 4. Position & Scale (X, Y, Z Axis) -->
            <div class="control-group">
                <h3>4. Character Position (X, Y, Z Axis)</h3>
                <div class="axis-inputs">
                    <div class="axis-box">
                        <label>X Axis (Left/Right)</label>
                        <input type="number" id="posX" value="200" oninput="updateTransform()">
                    </div>
                    <div class="axis-box">
                        <label>Y Axis (Up/Down)</label>
                        <input type="number" id="posY" value="50" oninput="updateTransform()">
                    </div>
                    <div class="axis-box">
                        <label>Z (Scale/Depth)</label>
                        <input type="number" id="posZ" value="1" step="0.1" min="0.2" max="3" oninput="updateTransform()">
                    </div>
                </div>
            </div>

            <!-- 5. Voice Recording & Sync -->
            <div class="control-group">
                <h3>5. Record & Sync Voice</h3>
                <div class="action-buttons">
                    <button id="recordBtn" class="btn btn-record">🎤 Start Recording</button>
                    <button id="playBtn" class="btn btn-play" disabled>▶️ Sync & Play Animation</button>
                </div>
            </div>
        </aside>

        <!-- Workspace Stage Area -->
        <main class="main-workspace">
            <div class="stage-container">
                <div id="viewport" class="viewport ratio-16-9">
                    <div id="characterWrapper" class="character-wrapper">
                        <!-- Default 2D Vector Character -->
                        <svg viewBox="-50 -20 450 500" xmlns="http://www.w3.org/2000/svg">
                            <g id="body" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                                <g id="left-leg">
                                    <path d="M 140 330 L 135 410" fill="none"/>
                                    <ellipse cx="125" cy="415" rx="18" ry="8" fill="#333" />
                                </g>
                                <g id="right-leg">
                                    <path d="M 210 330 L 215 410" fill="none"/>
                                    <ellipse cx="225" cy="415" rx="18" ry="8" fill="#333" />
                                </g>
                                <path d="M 110 210 L 240 210 L 230 330 L 120 330 Z" fill="#ffffff" />
                                <rect x="117" y="270" width="115" height="35" fill="#a03c51" stroke="#000" stroke-width="3" />
                                <g id="left-arm">
                                    <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="20" stroke="#ffffff" />
                                    <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="4" stroke="#000000" />
                                    <path d="M 25 250 C 10 240, 5 260, 15 270 C 5 275, 10 285, 25 275" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                                </g>
                                <g id="right-arm">
                                    <path d="M 240 215 L 285 270" fill="none" stroke-width="20" stroke="#ffffff" />
                                    <path d="M 240 215 L 285 270" fill="none" stroke-width="4" stroke="#000000" />
                                    <circle cx="290" cy="275" r="12" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                                </g>
                                <rect x="155" y="185" width="40" height="30" fill="#fcd7b6" stroke="#000" stroke-width="4" />
                                <g id="head">
                                    <path d="M 100 130 C 95 200, 255 200, 250 130 C 255 70, 95 70, 100 130 Z" fill="#fcd7b6" />
                                    <g id="eyes">
                                        <ellipse cx="135" cy="120" rx="22" ry="16" fill="#fff" />
                                        <circle cx="140" cy="120" r="7" fill="#000" />
                                        <path d="M 110 100 Q 135 90 160 105" fill="none" stroke="#000" stroke-width="4" />
                                        <ellipse cx="215" cy="120" rx="22" ry="16" fill="#fff" />
                                        <circle cx="210" cy="120" r="7" fill="#000" />
                                        <path d="M 190 105 Q 215 90 240 100" fill="none" stroke="#000" stroke-width="4" />
                                    </g>
                                    <path d="M 90 120 C 70 80, 90 30, 140 30 C 160 10, 200 10, 220 30 C 260 20, 280 70, 260 120 C 240 100, 240 70, 210 60 C 180 50, 130 60, 90 120 Z" fill="#801818" />
                                    <ellipse id="mouth" cx="175" cy="165" rx="16" ry="4" fill="#801818" />
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Video Editing Layers System Panel -->
            <div class="timeline-panel">
                <div class="timeline-header">
                    <span>📚 Layers Stack (Top to Bottom)</span>
                    <button class="btn-option" onclick="addTextLayer()">+ Add Text Overlay</button>
                </div>
                <div class="layer-list" id="layerList">
                    <div class="layer-item">
                        <div class="layer-info">
                            <span>🎭 Character Layer</span>
                        </div>
                        <button class="layer-btn">👁️</button>
                    </div>
                    <div class="layer-item">
                        <div class="layer-info">
                            <span>🖼️ Background Layer</span>
                        </div>
                        <button class="layer-btn">👁️</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentPitch = 1.0;
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let audioBuffer;
        let activeSource = null;
        let animationFrameId = null;

        const viewport = document.getElementById('viewport');
        const charWrapper = document.getElementById('characterWrapper');
        const posX = document.getElementById('posX');
        const posY = document.getElementById('posY');
        const posZ = document.getElementById('posZ');
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');

        // 1. Voice Presets
        function setVoice(type, e) {
            document.querySelectorAll('.sidebar .control-group:nth-child(1) .btn-option').forEach(b => b.classList.remove('active'));
            if(e) e.target.classList.add('active');

            if(type === 'normal') currentPitch = 1.0;
            if(type === 'kid') currentPitch = 1.6;
            if(type === 'monster') currentPitch = 0.6;
        }

        // 2. Aspect Ratio Controller
        function setRatio(ratio, e) {
            document.querySelectorAll('.sidebar .control-group:nth-child(3) .btn-option').forEach(b => b.classList.remove('active'));
            if(e) e.target.classList.add('active');

            viewport.className = `viewport ratio-${ratio}`;
        }

        // 3. Background Upload
        document.getElementById('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    viewport.style.backgroundImage = `url('${event.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        // 4. X, Y, Z Transformation Sync
        function updateTransform() {
            const x = posX.value;
            const y = posY.value;
            const z = posZ.value;

            charWrapper.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
        }
        updateTransform();

        // Drag Character via Mouse
        let isDragging = false, startX, startY;
        charWrapper.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - parseInt(posX.value);
            startY = e.clientY - parseInt(posY.value);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            posX.value = e.clientX - startX;
            posY.value = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // 5. Audio Processing & Animation Engine
        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        playBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Mic Access Denied: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.innerText = '🎤 Start Recording';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;

            if (audioContext.state === 'suspended') audioContext.resume();
            if (activeSource) try { activeSource.stop(); } catch(e){}
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const source = audioContext.createBufferSource();
            activeSource = source;
            source.buffer = audioBuffer;
            source.playbackRate.value = currentPitch;

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.5;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            source.connect(analyser);
            analyser.connect(audioContext.destination);
            source.start(0);

            function animate() {
                const mouth = document.getElementById('mouth');
                const leftArm = document.getElementById('left-arm');
                const rightArm = document.getElementById('right-arm');
                const leftLeg = document.getElementById('left-leg');
                const rightLeg = document.getElementById('right-leg');

                analyser.getByteFrequencyData(dataArray);
                let sum = dataArray.reduce((a, b) => a + b, 0);
                let average = sum / dataArray.length;

                if (mouth) mouth.style.transform = `scaleY(${Math.min(1 + average / 20, 4.5)})`;
                if (leftArm && rightArm) {
                    leftArm.style.transform = `rotate(${average / 6}deg)`;
                    rightArm.style.transform = `rotate(-${average / 6}deg)`;
                }
                if (leftLeg && rightLeg) {
                    leftLeg.style.transform = `rotate(-${average / 15}deg)`;
                    rightLeg.style.transform = `rotate(${average / 15}deg)`;
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            animate();

            source.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.getElementById('mouth').style.transform = 'scaleY(1)';
                document.getElementById('left-arm').style.transform = 'rotate(0deg)';
                document.getElementById('right-arm').style.transform = 'rotate(0deg)';
                document.getElementById('left-leg').style.transform = 'rotate(0deg)';
                document.getElementById('right-leg').style.transform = 'rotate(0deg)';
            };
        });

        // Add Layer Feature
        function addTextLayer() {
            const list = document.getElementById('layerList');
            const layerDiv = document.createElement('div');
            layerDiv.className = 'layer-item';
            layerDiv.innerHTML = `
                <div class="layer-info">
                    <span>📝 Text Overlay</span>
                </div>
                <button class="layer-btn" onclick="this.parentElement.remove()">🗑️</button>
            `;
            list.insertBefore(layerDiv, list.firstChild);
        }
    </script>
</body>
</html>
