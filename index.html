<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Alight Animation Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        .app-header {
            height: 50px;
            background: #181920;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #282a36;
            z-index: 20;
        }

        .app-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Workspace Canvas Area */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050507;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        .viewport {
            position: relative;
            background-color: #ffffff;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            border-radius: 6px;
            overflow: hidden;
            touch-action: none; /* Mobile touch gesture support */
        }

        /* Aspect Ratios */
        .ratio-16-9 { width: 100%; max-width: 640px; aspect-ratio: 16/9; }
        .ratio-9-16 { height: 100%; max-height: 480px; aspect-ratio: 9/16; }
        .ratio-1-1  { width: 100%; max-width: 380px; aspect-ratio: 1/1; }

        /* Draggable Transform Items */
        .draggable-element {
            position: absolute;
            top: 0;
            left: 0;
            cursor: move;
            touch-action: none;
            display: inline-block;
        }

        .draggable-element.selected {
            outline: 2px dashed #ff4757;
            outline-offset: 4px;
        }

        .character-wrapper {
            width: 180px;
            height: 240px;
        }

        .character-wrapper svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .asset-wrapper img {
            width: 100px;
            height: auto;
            pointer-events: none;
        }

        /* Bottom Controls Drawer (Alight Motion Style) */
        .bottom-panel {
            height: 250px;
            background: #181920;
            border-top: 1px solid #282a36;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .tab-bar {
            display: flex;
            background: #101115;
            border-bottom: 1px solid #282a36;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 18px;
            background: none;
            border: none;
            color: #a4b0be;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #ff4757;
            border-bottom-color: #ff4757;
            background: #181920;
        }

        .tab-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Control Rows & Grids */
        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-opt {
            padding: 10px;
            border: 1px solid #282a36;
            background: #20222c;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-opt.active {
            background: #ff4757;
            border-color: #ff4757;
        }

        .file-btn {
            background: #20222c;
            border: 1px dashed #4b4b4b;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
        }

        .file-btn input { display: none; }

        .btn-record {
            background: #ff4757;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
        }

        .btn-play {
            background: #2ed573;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            width: 100%;
        }

        .btn-record.recording {
            animation: pulse 1s infinite;
            background: #ff6b81;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Layers Panel */
        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #20222c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .layer-item.active {
            border: 1px solid #ff4757;
        }

        /* Dynamic SVG Animations */
        #mouth { transform-origin: center center; transform-box: fill-box; }
        #left-arm { transform-origin: top right; transform-box: fill-box; }
        #right-arm { transform-origin: top left; transform-box: fill-box; }
        #left-leg { transform-origin: top center; transform-box: fill-box; }
        #right-leg { transform-origin: top center; transform-box: fill-box; }
        #body { transform-origin: bottom center; transform-box: fill-box; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="app-title">🎬 2D Animation Studio</div>
    </header>

    <!-- Canvas Workspace Area -->
    <main class="workspace">
        <div id="viewport" class="viewport ratio-16-9">
            <!-- Character Drag Target Layer -->
            <div id="characterWrapper" class="draggable-element character-wrapper selected" style="transform: translate(100px, 40px) scale(1);">
                <svg viewBox="-50 -20 450 500" xmlns="http://www.w3.org/2000/svg">
                    <g id="body" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                        <g id="left-leg">
                            <path d="M 140 330 L 135 410" fill="none"/>
                            <ellipse cx="125" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <g id="right-leg">
                            <path d="M 210 330 L 215 410" fill="none"/>
                            <ellipse cx="225" cy="415" rx="18" ry="8" fill="#333" />
                        </g>
                        <path d="M 110 210 L 240 210 L 230 330 L 120 330 Z" fill="#ffffff" />
                        <rect x="117" y="270" width="115" height="35" fill="#a03c51" stroke="#000" stroke-width="3" />
                        <g id="left-arm">
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 110 215 L 60 270 L 20 250" fill="none" stroke-width="4" stroke="#000000" />
                            <path d="M 25 250 C 10 240, 5 260, 15 270 C 5 275, 10 285, 25 275" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <g id="right-arm">
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="20" stroke="#ffffff" />
                            <path d="M 240 215 L 285 270" fill="none" stroke-width="4" stroke="#000000" />
                            <circle cx="290" cy="275" r="12" fill="#fcd7b6" stroke="#000" stroke-width="3"/>
                        </g>
                        <rect x="155" y="185" width="40" height="30" fill="#fcd7b6" stroke="#000" stroke-width="4" />
                        <g id="head">
                            <path d="M 100 130 C 95 200, 255 200, 250 130 C 255 70, 95 70, 100 130 Z" fill="#fcd7b6" />
                            <g id="eyes">
                                <ellipse cx="135" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="140" cy="120" r="7" fill="#000" />
                                <path d="M 110 100 Q 135 90 160 105" fill="none" stroke="#000" stroke-width="4" />
                                <ellipse cx="215" cy="120" rx="22" ry="16" fill="#fff" />
                                <circle cx="210" cy="120" r="7" fill="#000" />
                                <path d="M 190 105 Q 215 90 240 100" fill="none" stroke="#000" stroke-width="4" />
                            </g>
                            <path d="M 90 120 C 70 80, 90 30, 140 30 C 160 10, 200 10, 220 30 C 260 20, 280 70, 260 120 C 240 100, 240 70, 210 60 C 180 50, 130 60, 90 120 Z" fill="#801818" />
                            <ellipse id="mouth" cx="175" cy="165" rx="16" ry="4" fill="#801818" />
                        </g>
                    </g>
                </svg>
            </div>
        </div>
    </main>

    <!-- Bottom Editing Drawer Panel -->
    <footer class="bottom-panel">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('voice', event)">🎤 Voice & Sync</button>
            <button class="tab-btn" onclick="switchTab('assets', event)">🖼️ Add Assets & BG</button>
            <button class="tab-btn" onclick="switchTab('transform', event)">📐 Size & Scale</button>
            <button class="tab-btn" onclick="switchTab('ratio', event)">📱 Aspect Ratio</button>
            <button class="tab-btn" onclick="switchTab('layers', event)">📚 Layers Stack</button>
        </div>

        <!-- Tab 1: Voice -->
        <div id="tab-voice" class="tab-content active">
            <p style="font-size:0.8rem; color:#a4b0be; margin-bottom:8px;">Select Pitch Preset:</p>
            <div class="btn-grid" style="margin-bottom:12px;">
                <div class="btn-opt active" onclick="setVoice('normal', event)">Normal</div>
                <div class="btn-opt" onclick="setVoice('kid', event)">Kid</div>
                <div class="btn-opt" onclick="setVoice('monster', event)">Monster</div>
            </div>
            <div class="control-row">
                <button id="recordBtn" class="btn-record">🎤 Start Recording</button>
                <button id="playBtn" class="btn-play" disabled>▶️ Sync & Play</button>
            </div>
        </div>

        <!-- Tab 2: Assets & Background -->
        <div id="tab-assets" class="tab-content">
            <div class="control-row">
                <label class="file-btn">
                    ➕ Upload Custom Asset (PNG/SVG)
                    <input type="file" id="assetUpload" accept="image/*">
                </label>
            </div>
            <div class="control-row">
                <label class="file-btn">
                    🖼️ Change Stage Background
                    <input type="file" id="bgUpload" accept="image/*">
                </label>
            </div>
        </div>

        <!-- Tab 3: Scale (Z-Axis) -->
        <div id="tab-transform" class="tab-content">
            <p style="font-size:0.8rem; color:#a4b0be; margin-bottom:8px;">Scale/Size (Z-Axis):</p>
            <input type="range" id="scaleSlider" min="0.3" max="2.5" step="0.1" value="1" style="width:100%; margin-bottom:10px;">
            <p style="font-size:0.75rem; color:#a4b0be;">💡 Tip: Canvas par apne finger se touch karke direct position set karein.</p>
        </div>

        <!-- Tab 4: Aspect Ratio -->
        <div id="tab-ratio" class="tab-content">
            <div class="btn-grid">
                <div class="btn-opt active" onclick="setRatio('16-9', event)">16:9 YouTube</div>
                <div class="btn-opt" onclick="setRatio('9-16', event)">9:16 Shorts</div>
                <div class="btn-opt" onclick="setRatio('1-1', event)">1:1 Square</div>
            </div>
        </div>

        <!-- Tab 5: Layers Panel -->
        <div id="tab-layers" class="tab-content">
            <div id="layerList">
                <div class="layer-item active">
                    <span>🎭 Main Character</span>
                    <span>Active</span>
                </div>
                <div class="layer-item">
                    <span>🖼️ Background</span>
                    <span>Fixed</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        let currentPitch = 1.0;
        let mediaRecorder, audioChunks = [], audioContext, audioBuffer, activeSource, animationFrameId;
        let selectedElement = document.getElementById('characterWrapper');

        const viewport = document.getElementById('viewport');
        const scaleSlider = document.getElementById('scaleSlider');

        // Tab Switching Engine
        function switchTab(tabId, e) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Voice Presets
        function setVoice(type, e) {
            document.querySelectorAll('#tab-voice .btn-opt').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            if(type === 'normal') currentPitch = 1.0;
            if(type === 'kid') currentPitch = 1.6;
            if(type === 'monster') currentPitch = 0.6;
        }

        // Aspect Ratio
        function setRatio(ratio, e) {
            document.querySelectorAll('#tab-ratio .btn-opt').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            viewport.className = `viewport ratio-${ratio}`;
        }

        // Background Upload
        document.getElementById('bgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    viewport.style.backgroundImage = `url('${evt.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Add Custom PNG/SVG Asset Layer
        document.getElementById('assetUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const assetDiv = document.createElement('div');
                    assetDiv.className = 'draggable-element asset-wrapper';
                    assetDiv.style.transform = `translate(50px, 50px) scale(1)`;
                    assetDiv.innerHTML = `<img src="${evt.target.result}">`;
                    
                    viewport.appendChild(assetDiv);
                    makeDraggable(assetDiv);
                    selectElement(assetDiv);

                    // Add to Layers List
                    const layerList = document.getElementById('layerList');
                    const layerItem = document.createElement('div');
                    layerItem.className = 'layer-item';
                    layerItem.innerHTML = `<span>📦 Asset Layer</span><span onclick="this.parentElement.remove(); assetDiv.remove();">🗑️</span>`;
                    layerList.appendChild(layerItem);
                };
                reader.readAsDataURL(file);
            }
        });

        // Touch & Drag System (Alight Motion Touch Support)
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, currentX = 100, currentY = 40, currentScale = 1;

            function getTransformValues(el) {
                const transform = el.style.transform;
                const matchTranslate = transform.match(/translate\(([^px]+)px,\s*([^px]+)px\)/);
                const matchScale = transform.match(/scale\(([^)]+)\)/);
                
                let x = matchTranslate ? parseFloat(matchTranslate[1]) : 0;
                let y = matchTranslate ? parseFloat(matchTranslate[2]) : 0;
                let s = matchScale ? parseFloat(matchScale[1]) : 1;
                return { x, y, s };
            }

            function onPointerDown(e) {
                isDragging = true;
                selectElement(element);

                const coords = getTransformValues(element);
                currentX = coords.x;
                currentY = coords.y;
                currentScale = coords.s;

                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
                startY = (e.touches ? e.touches[0].clientY : e.clientY) - currentY;

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                currentX = clientX - startX;
                currentY = clientY - startY;

                element.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
            }

            function onPointerUp() {
                isDragging = false;
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            }

            element.addEventListener('pointerdown', onPointerDown);
        }

        function selectElement(el) {
            document.querySelectorAll('.draggable-element').forEach(e => e.classList.remove('selected'));
            selectedElement = el;
            selectedElement.classList.add('selected');
        }

        makeDraggable(document.getElementById('characterWrapper'));

        // Scale Control (Z-Axis)
        scaleSlider.addEventListener('input', (e) => {
            if(!selectedElement) return;
            const transform = selectedElement.style.transform;
            const matchTranslate = transform.match(/translate\(([^px]+)px,\s*([^px]+)px\)/);
            let x = matchTranslate ? matchTranslate[1] : 0;
            let y = matchTranslate ? matchTranslate[2] : 0;
            
            selectedElement.style.transform = `translate(${x}px, ${y}px) scale(${e.target.value})`;
        });

        // Recording & Animation Sync Engine
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        playBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Mic Access Denied: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.innerText = '🎤 Start Recording';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            if (activeSource) try { activeSource.stop(); } catch(e){}
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const source = audioContext.createBufferSource();
            activeSource = source;
            source.buffer = audioBuffer;
            source.playbackRate.value = currentPitch;

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.5;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            source.connect(analyser);
            analyser.connect(audioContext.destination);
            source.start(0);

            function animate() {
                const mouth = document.getElementById('mouth');
                const leftArm = document.getElementById('left-arm');
                const rightArm = document.getElementById('right-arm');
                const leftLeg = document.getElementById('left-leg');
                const rightLeg = document.getElementById('right-leg');

                analyser.getByteFrequencyData(dataArray);
                let sum = dataArray.reduce((a, b) => a + b, 0);
                let average = sum / dataArray.length;

                if (mouth) mouth.style.transform = `scaleY(${Math.min(1 + average / 20, 4.5)})`;
                if (leftArm && rightArm) {
                    leftArm.style.transform = `rotate(${average / 6}deg)`;
                    rightArm.style.transform = `rotate(-${average / 6}deg)`;
                }
                if (leftLeg && rightLeg) {
                    leftLeg.style.transform = `rotate(-${average / 15}deg)`;
                    rightLeg.style.transform = `rotate(${average / 15}deg)`;
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            animate();

            source.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.getElementById('mouth').style.transform = 'scaleY(1)';
                document.getElementById('left-arm').style.transform = 'rotate(0deg)';
                document.getElementById('right-arm').style.transform = 'rotate(0deg)';
                document.getElementById('left-leg').style.transform = 'rotate(0deg)';
                document.getElementById('right-leg').style.transform = 'rotate(0deg)';
            };
        });
    </script>
</body>
</html>
