<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Voice & Lip-Sync Studio</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 320px;
            background: #16213e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .sidebar h2 {
            color: #e94560;
            font-size: 1.5rem;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group h3 {
            font-size: 1rem;
            color: #4ecca3;
        }

        .character-selector {
            display: flex;
            gap: 10px;
        }

        .character-selector button {
            flex: 1;
            padding: 10px;
            border: none;
            background: #0f3460;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .character-selector button.active, .character-selector button:hover {
            background: #e94560;
        }

        input[type="file"] {
            background: #0f3460;
            padding: 8px;
            border-radius: 5px;
            color: white;
            font-size: 0.8rem;
        }

        small {
            color: #888;
            font-size: 0.75rem;
        }

        .voice-effects {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input[type="range"] {
            width: 100%;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-record { background: #e94560; color: white; }
        .btn-record.recording { background: #ff414d; animation: pulse 1s infinite; }
        .btn-play { background: #4ecca3; color: #1a1a2e; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Stage Styling */
        .stage-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f3460, #16213e);
            position: relative;
            overflow: hidden;
        }

        .stage {
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage svg {
            width: 100%;
            height: 100%;
        }

        /* Fixed Transform Origin for Lip Sync */
        #mouth {
            transform-origin: center center;
            transform-box: fill-box;
            transition: transform 0.05s ease-out;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <h2>🎨 Controls</h2>

            <div class="control-group">
                <h3>1. Select Character</h3>
                <div class="character-selector">
                    <button onclick="selectCharacter('boy', event)" class="active">Boy</button>
                    <button onclick="selectCharacter('robot', event)">Robot</button>
                    <button onclick="selectCharacter('monster', event)">Monster</button>
                </div>
            </div>

            <div class="control-group">
                <h3>2. Upload Custom SVG</h3>
                <input type="file" id="svgUpload" accept=".svg">
                <small>Ensure custom SVG has <code>id="mouth"</code> element!</small>
            </div>

            <div class="control-group">
                <h3>3. Voice & Recording</h3>
                <div class="voice-effects">
                    <label for="pitch">Voice Pitch (Cartoon Effect):</label>
                    <input type="range" id="pitch" min="0.5" max="2.0" step="0.1" value="1.5">
                </div>
                
                <div class="action-buttons">
                    <button id="recordBtn" class="btn btn-record">🎤 Start Recording</button>
                    <button id="playBtn" class="btn btn-play" disabled>▶️ Play & Sync</button>
                </div>
            </div>
        </aside>

        <main class="stage-container">
            <div id="stage" class="stage"></div>
        </main>
    </div>

    <script>
        const characters = {
            boy: `
                <svg viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="80" fill="#f1c27d" />
                    <circle cx="70" cy="80" r="10" fill="#333" />
                    <circle cx="130" cy="80" r="10" fill="#333" />
                    <path d="M 30 80 Q 100 10 170 80" fill="#4a2e1d" />
                    <ellipse id="mouth" cx="100" cy="130" rx="20" ry="4" fill="#a00000" />
                </svg>`,
            robot: `
                <svg viewBox="0 0 200 200">
                    <rect x="30" y="30" width="140" height="140" rx="20" fill="#95a5a6" />
                    <rect x="50" y="60" width="30" height="20" fill="#00d2d3" />
                    <rect x="120" y="60" width="30" height="20" fill="#00d2d3" />
                    <line x1="100" y1="30" x2="100" y2="10" stroke="#7f8c8d" stroke-width="6"/>
                    <circle cx="100" cy="10" r="8" fill="#e74c3c" />
                    <rect id="mouth" x="70" y="125" width="60" height="6" fill="#2c3e50" rx="2" />
                </svg>`,
            monster: `
                <svg viewBox="0 0 200 200">
                    <path d="M 30 160 C 20 40, 180 40, 170 160 Z" fill="#a55eea" />
                    <circle cx="100" cy="80" r="25" fill="#fff" />
                    <circle cx="100" cy="80" r="10" fill="#000" />
                    <polygon points="50,50 40,20 65,40" fill="#f7b731" />
                    <polygon points="150,50 160,20 135,40" fill="#f7b731" />
                    <ellipse id="mouth" cx="100" cy="130" rx="25" ry="5" fill="#2d98da" />
                </svg>`
        };

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let audioContext;
        let audioBuffer;
        let activeSource = null;
        let animationFrameId = null;

        const stage = document.getElementById('stage');
        const recordBtn = document.getElementById('recordBtn');
        const playBtn = document.getElementById('playBtn');
        const pitchInput = document.getElementById('pitch');
        const svgUpload = document.getElementById('svgUpload');

        stage.innerHTML = characters.boy;

        function selectCharacter(type, event) {
            document.querySelectorAll('.character-selector button').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            if (characters[type]) {
                stage.innerHTML = characters[type];
            }
        }

        svgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    stage.innerHTML = event.target.result;
                };
                reader.readAsText(file);
            }
        });

        recordBtn.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = async () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                        
                        playBtn.disabled = false;
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = '🛑 Stop Recording';
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert('Error accessing microphone: ' + err.message);
                }
            } else {
                mediaRecorder.stop();
                recordBtn.innerText = '🎤 Start Recording';
                recordBtn.classList.remove('recording');
            }
        });

        playBtn.addEventListener('click', () => {
            if (!audioBuffer) return;

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (activeSource) {
                try { activeSource.stop(); } catch(e){}
            }

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            const source = audioContext.createBufferSource();
            activeSource = source;
            source.buffer = audioBuffer;

            source.playbackRate.value = parseFloat(pitchInput.value);

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.5; // Smooth mouth movement
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            source.start(0);

            function animateMouth() {
                const mouth = document.getElementById('mouth');
                
                if (!mouth) return;

                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                let average = sum / bufferLength;

                // Controlled scaling so mouth stays in position
                let scaleY = 1 + (average / 35); 
                if (scaleY > 3.5) scaleY = 3.5; // Cap max open limit

                mouth.style.transform = `scaleY(${scaleY})`;

                animationFrameId = requestAnimationFrame(animateMouth);
            }

            animateMouth();

            source.onended = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                const mouth = document.getElementById('mouth');
                if (mouth) mouth.style.transform = 'scaleY(1)';
                activeSource = null;
            };
        });
    </script>
</body>
</html>
